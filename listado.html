<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de avisos</title>
  <link rel="stylesheet" href="Css/styles-css.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Listado de avisos de adopción</h1>
      <p class="welcome-message">Haz clic en una fila para ver el detalle.</p>

      <nav>
        <div class="nav-menu">
          <button class="nav-btn" onclick="navigateToPage('portada.html')">🏠 Portada</button>
          <button class="nav-btn" onclick="navigateToPage('agregar.html')">📝 Agregar aviso</button>
          <button class="nav-btn" onclick="navigateToPage('estadisticas.html')">📊 Estadísticas</button>
        </div>
      </nav>
    </header>

    <main class="recent-adoptions">
      <h2 class="section-title">Listado completo</h2>

      <table class="adoptions-table">
        <thead>
          <tr>
            <th>Fecha publicación</th>
            <th>Fecha entrega</th>
            <th>Comuna</th>
            <th>Sector</th>
            <th>Cantidad · tipo · edad</th>
            <th>Nombre contacto</th>
            <th>Total fotos</th>
          </tr>
        </thead>
        <tbody id="listado-body"></tbody>
      </table>
    </main>

    <div class="footer">
      <p>Haz clic en una fila para ir al detalle.</p>
    </div>
  </div>

  <script src="Js/script-js.js"></script>
  <script src="Js/listado-js.js"></script>
</body>
</html>
